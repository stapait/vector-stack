---
- name: Criar diretórios do Vector
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - { path: /etc/vector, owner: root, group: root }
    - { path: "{{ vector_data_root }}/logs", owner: "{{ vector_system_user }}", group: "{{ vector_system_group }}" }

- name: "Baixar e extrair Vector {{ vector_version }}"
  unarchive:
    src: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-{{ vector_target }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/vector-{{ vector_target }}/bin/vector"

- name: Apontar /usr/local/bin/vector para a versão instalada
  file:
    src: "/opt/vector-{{ vector_target }}/bin/vector"
    dest: /usr/local/bin/vector
    state: link
    force: true

- name: Configurar vector.yaml
  template:
    src: vector.yaml.j2
    dest: /etc/vector/vector.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart vector

- name: Instalar unit systemd do Vector
  template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart vector

- name: Habilitar e iniciar o Vector
  systemd:
    name: vector
    enabled: true
    state: started
    daemon_reload: true
