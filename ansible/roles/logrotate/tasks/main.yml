---
- name: Instalar pacote logrotate
  dnf:
    name: logrotate
    state: present

- name: Criar diretório de state próprio do logrotate
  file:
    path: /var/lib/vector-logrotate
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configurar logrotate do Vector
  template:
    src: logrotate-vector.conf.j2
    dest: /etc/vector/logrotate-vector.conf
    owner: root
    group: root
    mode: "0644"

- name: Instalar service/timer de rotação horária
  template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | replace('.j2', '') }}"
    mode: "0644"
  loop:
    - vector-logrotate.service.j2
    - vector-logrotate.timer.j2
  notify: Restart vector-logrotate.timer

- name: Habilitar e iniciar o timer de rotação
  systemd:
    name: vector-logrotate.timer
    enabled: true
    state: started
    daemon_reload: true
