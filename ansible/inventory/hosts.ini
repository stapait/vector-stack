# Inventário de exemplo — uma única máquina (concentradora de logs).
#
# Duas formas de apontar o IP real da EC2:
#
# 1) Editando aqui embaixo (troque CHANGE_ME):
#
[vector]
vector-concentrador ansible_host=CHANGE_ME

#
# 2) Sem editar este arquivo, passando por linha de comando (sobrescreve
#    este inventário inteiro, mais simples para um teste rápido):
#
#    ansible-playbook -i "<IP_DA_EC2>," vector-provision.yml \
#      -u ec2-user --private-key ~/.ssh/minha-chave.pem \
#      -e @vars/vector.yml
#
# (repare na vírgula depois do IP — é a sintaxe do Ansible para inventário
# inline de um único host, sem precisar de arquivo)

[vector:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/minha-chave.pem
ansible_python_interpreter=/usr/bin/python3
