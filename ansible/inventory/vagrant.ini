# Inventário da VM Vagrant (vagrant/) — Amazon Linux 2023 (box
# bento/amazonlinux-2023) rodando de verdade no VirtualBox, não em
# container. Ver vagrant/README.md pra subir a VM antes de usar isto.
#
# Chave privada gerada pelo próprio `vagrant up` (não a insecure_key
# padrão) em caminho previsível porque a máquina tem nome fixo ("vector")
# no Vagrantfile — regenerada a cada `vagrant destroy` + `vagrant up`, por
# isso StrictHostKeyChecking fica desabilitado (igual ao inventário
# local-ec2, mesmo motivo: descartável/local).
[vector]
vagrant-vector ansible_host=192.168.56.20

[vector:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=../vagrant/.vagrant/machines/vector/virtualbox/private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
