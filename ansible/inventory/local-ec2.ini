# Inventário do "EC2 local" (docker/local-ec2) — Amazon Linux 2023 de
# verdade rodando em container, só pra testar a automação sem AWS. Ver
# docker/local-ec2/README.md pra subir o container antes de usar isto.
#
# host key muda a cada rebuild do container, por isso desabilita o check —
# aceitável aqui porque é descartável/local; não replique isso pro
# inventário de uma EC2 real.
[vector]
local-ec2-vector ansible_host=127.0.0.1 ansible_port=2222

[vector:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=../docker/local-ec2/ssh/id_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
