services:
  ec2-vector:
    build: .
    container_name: local-ec2-vector
    hostname: local-ec2-vector
    # systemd como PID 1 dentro de um container precisa disso — não tem
    # meio-termo leve aqui, é o preço de rodar um init de verdade.
    privileged: true
    cgroup: host
    security_opt:
      - apparmor:unconfined
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Simula o EBS "já montado" que a role common (vector-provision.yml)
      # espera encontrar em /mnt/vector — é só um volume nomeado do Docker,
      # mas aparece em /proc/mounts como ponto de montagem de verdade, que
      # é tudo que o assert da role checa.
      - vector-data:/mnt/vector
    ports:
      - "2222:22"
    stop_signal: SIGRTMIN+3

volumes:
  vector-data:
