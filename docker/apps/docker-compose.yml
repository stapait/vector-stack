# Compose separado do docker/concentrador. Todas as apps usam a MESMA imagem
# (build: ./app) e só variam por env vars + arquivo de filebeat montado —
# para adicionar uma 4ª app, copie um bloco de serviço abaixo, troque
# APP_NAME/LOG_FILE/container_name e crie um filebeat-<nome>.yml em
# ./filebeat/ apontando para o mesmo arquivo de log. Nenhuma mudança é
# necessária do lado do Vector/concentrador.
networks:
  vector-stack:
    name: vector-stack
    external: true

services:
  orders-app:
    build: ./app
    container_name: orders-app
    restart: unless-stopped
    environment:
      - APP_NAME=orders-app
      - LOG_FILE=/var/log/app/orders-app.log
    volumes:
      - ./filebeat/filebeat-orders-app.yml:/etc/filebeat/filebeat.yml:ro
    networks:
      - vector-stack

  payments-app:
    build: ./app
    container_name: payments-app
    restart: unless-stopped
    environment:
      - APP_NAME=payments-app
      - LOG_FILE=/var/log/app/payments-app.log
    volumes:
      - ./filebeat/filebeat-payments-app.yml:/etc/filebeat/filebeat.yml:ro
    networks:
      - vector-stack

  shipping-app:
    build: ./app
    container_name: shipping-app
    restart: unless-stopped
    environment:
      - APP_NAME=shipping-app
      - LOG_FILE=/var/log/app/shipping-app.log
    volumes:
      - ./filebeat/filebeat-shipping-app.yml:/etc/filebeat/filebeat.yml:ro
    networks:
      - vector-stack
