services:
  vector:
    image: timberio/vector:0.43.0-debian
    container_name: concentrador-vector
    restart: unless-stopped
    user: "${UID:-0}:${GID:-0}"
    ports:
      - "5044:5044"
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./data/logs:/mnt/logs
    command: ["--config", "/etc/vector/vector.yaml"]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: concentrador-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - ./data/textfile:/var/lib/node_exporter/textfile_collector:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"

  textfile-collector:
    build: ./textfile-collector
    container_name: concentrador-textfile-collector
    restart: unless-stopped
    user: "${UID:-0}:${GID:-0}"
    volumes:
      - ./data/logs:/mnt/logs:ro
      - ./data/textfile:/var/lib/node_exporter/textfile_collector
    environment:
      - INTERVAL_SECONDS=900

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: concentrador-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:11.2.0
    container_name: concentrador-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_DISABLE_SIGNOUT_MENU=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
